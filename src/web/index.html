<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clv</title>
    <script>
    // Pre-mount: kill the dark-mode flash by applying .theme-dark from the OS
// preference before the app bundle runs. The App effect reconciles the
// pinned/toggled theme once React mounts.
try {
	if (
		window.matchMedia &&
		window.matchMedia("(prefers-color-scheme: dark)").matches
	) {
		document.documentElement.classList.add("theme-dark");
	}
} catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
